name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      ZEPHYR_BASE: ${{ github.workspace }}/deps/zephyr
      ZEPHYR_TOOLCHAIN_VARIANT: host

    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          path: project

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gperf device-tree-compiler \
            gcc-multilib g++-multilib libmagic1
          python -m pip install west

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            modules
            bootloader
            tools
          key: zephyr-${{ runner.os }}-${{ hashFiles('project/west.yml') }}
          restore-keys: |
            zephyr-${{ runner.os }}-

      - name: Initialize workspace and fetch modules
        run: |
          west init -l project
          west update

      - name: Install Zephyr Python dependencies
        run: |
          python -m pip install -r "$ZEPHYR_BASE/scripts/requirements.txt"

      - name: Record dependency revisions
        run: |
          mkdir -p build
          west manifest --freeze > build/west-frozen.yml

      - name: Build application
        run: |
          west build -b native_sim -d build/app project/app -- \
            -DZephyr_DIR="$ZEPHYR_BASE/share/zephyr-package/cmake" \
            2>&1 | tee build/app-build.log

      - name: Run unit and integration tests
        run: |
          west twister \
            -T project/tests \
            -p native_sim \
            --inline-logs \
            --outdir build/twister \
            --extra-args "Zephyr_DIR=$ZEPHYR_BASE/share/zephyr-package/cmake"

      - name: Save logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-results
          path: |
            build/app-build.log
            build/west-frozen.yml
            build/twister/
          if-no-files-found: warn
          retention-days: 14